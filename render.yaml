# Render Blueprint: the whole app (web + API + in-process MCP servers + GigSim) as ONE free web service.
# Render dashboard -> New -> Blueprint -> pick this GitHub repo. It asks for the two `sync: false` values below;
# the other secrets are generated by Render. Free plan: 512 MB RAM, sleeps after 15 idle minutes (~1 min to wake),
# disk resets on restart (the reviewer account and demo data are re-seeded on start). No payment method needed.
services:
  - type: web
    name: gigbid
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/docker/allinone.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY            # free key from console.groq.com/keys
        sync: false
      - key: REVIEWER_PASSWORD       # you choose it (8+ characters); share it only in the private Classroom comment
        sync: false
      - key: REVIEWER_EMAIL
        value: reviewer@gigbid.app
      - key: APP_SECRET_KEY
        generateValue: true
      - key: MCP_JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GIGSIM_ADMIN_TOKEN
        generateValue: true
      - key: MODEL_PROFILE
        value: open
      - key: COOKIE_SECURE
        value: "1"
      - key: ALLOW_SIGNUP            # reviewers use the seeded account; strangers cannot spend the free model quota
        value: "0"
      # stay inside 512 MB: one bulk analysis at a time, fewer malloc arenas, a small Node heap
      - key: INLINE_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: NODE_OPTIONS
        value: --max-old-space-size=128
