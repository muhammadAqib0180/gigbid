[project]
name = "gigbid"
version = "0.2.0"
description = "GigBid: a multi-agent freelancer copilot (LangGraph + MCP + advanced RAG) for AI-4016"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  # web / api
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  # agents
  "langgraph>=0.6",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
  "langgraph-supervisor>=0.0.27",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-ollama>=0.3",
  "langchain-mcp-adapters>=0.1.9",
  "langsmith>=0.3",
  "mcp>=1.12,<2",
  # data
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.0",
  "arq>=0.26",
  "numpy>=1.26",
  "pandas>=2.2",
  "openpyxl>=3.1",
  # rag
  "fastembed>=0.5",
  "qdrant-client>=1.11",
  "pymupdf>=1.24",
  "fpdf2>=2.7",
  # security
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "markdown>=3.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "rag", "mcp_servers", "apps", "worker", "gigsim", "evals"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["apps/web", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "B023", "B007"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B017"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "mcp_servers"]
markers = [
  "llm: needs a real model endpoint (skipped in CI)",
  "integration: runs against a live GigSim service",
]
