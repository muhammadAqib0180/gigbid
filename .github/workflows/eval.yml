name: eval
on: [pull_request, workflow_dispatch]

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    env: { MODEL_PROFILE: test, HF_HUB_DISABLE_PROGRESS_BARS: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.8" }
      - run: uv sync --frozen
      - name: 30-job smoke eval (10 per persona) + fixed GigSim run
        run: |
          uv run python -m evals.runners.decision_eval --n 10 --out smoke_decisions
          uv run python -m evals.runners.gigsim_outcomes --n 3 --out smoke_outcomes
      - name: Gate on thresholds (evals/thresholds.yaml)
        run: uv run python -m evals.check_thresholds
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-eval, path: evals/results/smoke_* }
