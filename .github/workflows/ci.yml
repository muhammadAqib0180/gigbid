name: CI
on: [push, pull_request]
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }

jobs:
  python:
    runs-on: ubuntu-latest
    env: { MODEL_PROFILE: test, GIGBID_MCP_INPROCESS: "1", HF_HUB_DISABLE_PROGRESS_BARS: "1" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.8" }
      - run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: gigsim/ unchanged
        run: uv run python -m scripts.gigsim_manifest --check
      - name: No secrets in the repo
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Unit, contract (MCP schema snapshots), MCP in-memory and graph integration tests (+ prompts-in-dir rule)
        run: uv run pytest -q
      - name: README numbers trace to evals/results
        run: uv run python -m scripts.render_results --check

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - name: Generated API client is up to date
        run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, web]
    env: { MODEL_PROFILE: test, REVIEWER_PASSWORD: ci-reviewer-pass, GIGSIM_ERROR_RATE: "0", HF_HUB_DISABLE_PROGRESS_BARS: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.8" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: uv sync --frozen
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start GigSim + API + web
        run: |
          uv run python -m scripts.dev --reset --web > stack.log 2>&1 &
          for i in $(seq 1 120); do curl -sf localhost:3000/login >/dev/null && curl -sf localhost:8000/health >/dev/null && break; sleep 2; done
      - name: Playwright
        run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: "apps/web/playwright-report\nstack.log" }
